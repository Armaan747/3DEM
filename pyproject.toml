[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threedem"
version = "0.1.0"
description = "Finite element analysis of 3D-printed parts, driven by the slicer's G-code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.12"]

[project.optional-dependencies]
fast = ["pyamg"]
gui = ["PySide6", "pyvista", "pyvistaqt", "matplotlib"]
dev = ["pytest"]

[project.scripts]
threedem = "threedem.cli:main"

[project.gui-scripts]
threedem-gui = "threedem.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
